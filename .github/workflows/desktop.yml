name: Desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
            package: dist/Pomodoro-Linux-x64.tar.gz
          - os: windows-latest
            platform: Windows
            package: dist/Pomodoro-Windows-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-desktop.txt "pyinstaller>=6.11,<7"
      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libx11-xcb1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3
      - run: python -m unittest discover -s tests -p desktop_test.py -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: Pomodoro-${{ matrix.platform }}-x64
          path: ${{ matrix.package }}
          if-no-files-found: error
  timer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/timer.test.mjs
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, timer]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Pomodoro-*-x64
          path: packages
          merge-multiple: true
      - name: Publish separate Windows and Linux downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" packages/* --verify-tag --title "Pomodoro $RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
